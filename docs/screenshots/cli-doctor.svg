<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect x="20" y="20" width="910" height="520" rx="12" fill="#11111b" stroke="#313244" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Titlebar -->
  <path d="M20,32 A12,12 0 0,1 32,20 L918,20 A12,12 0 0,1 930,32 L930,62 L20,62 Z" fill="url(#headerGrad)"/>
  <circle cx="45" cy="41" r="6" fill="#f38ba8"/>
  <circle cx="65" cy="41" r="6" fill="#f9e2af"/>
  <circle cx="85" cy="41" r="6" fill="#a6e3a1"/>
  <text x="475" y="46" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#cdd6f4" text-anchor="middle">terminal — nodewipe doctor ~</text>

  <!-- Prompt command -->
  <text x="50" y="95" font-family="'JetBrains Mono', monospace" font-size="14" fill="#a6adc8">
    <tspan fill="#a6e3a1" font-weight="bold">❯ </tspan><tspan fill="#cdd6f4" font-weight="bold">nodewipe doctor ~</tspan>
  </text>

  <!-- Output Header -->
  <text x="50" y="135" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#89b4fa">🩺  Ecosystem Health &amp; Waste Analysis</text>
  <line x1="50" y1="150" x2="880" y2="150" stroke="#313244" stroke-width="1"/>

  <!-- Table Header -->
  <text x="50" y="175" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#6c7086">ECOSYSTEM          COUNT       TOTAL SIZE   OLDEST ARTIFACT            PATH</text>
  <line x1="50" y1="185" x2="880" y2="185" stroke="#313244" stroke-width="1"/>

  <!-- Row 1: Rust -->
  <text x="50" y="215" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#f38ba8">Rust (target/)     12 dirs     14.24 GB     114 days ago (abandoned)   ~/Projects/old-parser/target</text>

  <!-- Row 2: Node -->
  <text x="50" y="245" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#a6e3a1">Node.js (modules)  24 dirs      6.18 GB      89 days ago (stale)       ~/Projects/web-legacy/node_modules</text>

  <!-- Row 3: Python -->
  <text x="50" y="275" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#89dceb">Python (.venv)      8 dirs      2.45 GB      65 days ago               ~/Projects/research-tool/.venv</text>

  <!-- Row 4: Java/Gradle -->
  <text x="50" y="305" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#fab387">Java (Gradle/Mvn)   3 dirs      1.12 GB     180 days ago (abandoned)   ~/Projects/backend-service/build</text>

  <!-- Row 5: Go Cache -->
  <text x="50" y="335" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#f9e2af">Go (cache/mod)      2 dirs     540.2 MB      45 days ago               ~/Projects/go-microservice/go-build</text>

  <line x1="50" y1="360" x2="880" y2="360" stroke="#313244" stroke-width="1"/>

  <!-- Summary Cards -->
  <rect x="50" y="380" width="260" height="70" rx="6" fill="#181825" stroke="#89b4fa" stroke-width="1"/>
  <text x="70" y="405" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a6adc8">TOTAL RECLAIMABLE</text>
  <text x="70" y="435" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" fill="#89b4fa">24.53 GB</text>

  <rect x="330" y="380" width="260" height="70" rx="6" fill="#181825" stroke="#f38ba8" stroke-width="1"/>
  <text x="350" y="405" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a6adc8">ABANDONED ARTIFACTS</text>
  <text x="350" y="435" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" fill="#f38ba8">9 Projects</text>

  <rect x="610" y="380" width="270" height="70" rx="6" fill="#181825" stroke="#a6e3a1" stroke-width="1"/>
  <text x="630" y="405" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a6adc8">SAFEST QUICK CLEAN</text>
  <text x="630" y="435" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#a6e3a1">nodewipe --preset rust</text>

  <!-- Footer Tip -->
  <text x="50" y="495" font-family="'JetBrains Mono', monospace" font-size="12" fill="#9399b2">
    💡 <tspan fill="#f9e2af">Tip:</tspan> Run <tspan fill="#89b4fa">nodewipe scan --stale-days 60</tspan> or <tspan fill="#89b4fa">nodewipe scan --export report.csv</tspan> to audit unattended directories.
  </text>
</svg>

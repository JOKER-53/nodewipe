<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect x="20" y="20" width="910" height="520" rx="12" fill="#11111b" stroke="#313244" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Titlebar -->
  <path d="M20,32 A12,12 0 0,1 32,20 L918,20 A12,12 0 0,1 930,32 L930,62 L20,62 Z" fill="url(#headerGrad)"/>
  <circle cx="45" cy="41" r="6" fill="#f38ba8"/>
  <circle cx="65" cy="41" r="6" fill="#f9e2af"/>
  <circle cx="85" cy="41" r="6" fill="#a6e3a1"/>
  <text x="475" y="46" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#cdd6f4" text-anchor="middle">nodewipe Desktop — Precision Dev Cleaner</text>

  <!-- Sidebar Navigation -->
  <rect x="20" y="62" width="200" height="478" fill="#181825" stroke="#313244" stroke-width="1"/>
  
  <!-- Logo in sidebar -->
  <circle cx="50" cy="100" r="14" fill="url(#purpleGrad)"/>
  <text x="75" y="105" font-family="'Inter', sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">nodewipe</text>

  <!-- Nav Items -->
  <rect x="35" y="140" width="170" height="36" rx="6" fill="#313244" opacity="0.8"/>
  <text x="50" y="163" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#89b4fa">🔍  Scan &amp; Clean</text>

  <text x="50" y="210" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#a6adc8">🩺  Doctor Health</text>
  <text x="50" y="255" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#a6adc8">📊  Lifetime Stats</text>
  <text x="50" y="300" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#a6adc8">⚙️  Settings</text>

  <!-- Main Content Area -->
  <!-- Search & Filter Bar -->
  <rect x="240" y="80" width="460" height="40" rx="8" fill="#181825" stroke="#313244" stroke-width="1"/>
  <text x="260" y="105" font-family="'Inter', sans-serif" font-size="13" fill="#6c7086">Search path or ecosystem...</text>

  <rect x="715" y="80" width="195" height="40" rx="8" fill="url(#purpleGrad)"/>
  <text x="812" y="105" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Scan Folder</text>

  <!-- Ecosystem Filter Chips -->
  <rect x="240" y="135" width="70" height="28" rx="14" fill="#89b4fa" opacity="0.2"/>
  <text x="275" y="154" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#89b4fa" text-anchor="middle">All (38)</text>

  <rect x="320" y="135" width="75" height="28" rx="14" fill="#313244"/>
  <text x="357" y="154" font-family="'Inter', sans-serif" font-size="12" fill="#cdd6f4" text-anchor="middle">Node.js</text>

  <rect x="405" y="135" width="70" height="28" rx="14" fill="#313244"/>
  <text x="440" y="154" font-family="'Inter', sans-serif" font-size="12" fill="#cdd6f4" text-anchor="middle">Rust</text>

  <rect x="485" y="135" width="75" height="28" rx="14" fill="#313244"/>
  <text x="522" y="154" font-family="'Inter', sans-serif" font-size="12" fill="#cdd6f4" text-anchor="middle">Python</text>

  <rect x="570" y="135" width="65" height="28" rx="14" fill="#313244"/>
  <text x="602" y="154" font-family="'Inter', sans-serif" font-size="12" fill="#cdd6f4" text-anchor="middle">Java</text>

  <!-- Table View -->
  <rect x="240" y="180" width="670" height="270" rx="8" fill="#181825" stroke="#313244" stroke-width="1"/>
  <text x="260" y="210" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#6c7086">NAME &amp; PATH</text>
  <text x="580" y="210" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#6c7086">LAST MODIFIED</text>
  <text x="830" y="210" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#6c7086" text-anchor="end">SIZE</text>
  <line x1="260" y1="225" x2="890" y2="225" stroke="#313244" stroke-width="1"/>

  <!-- Row 1 -->
  <text x="260" y="255" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">npkill-rs / target</text>
  <text x="260" y="272" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6c7086">~/Projects/npkill-rs/target</text>
  <text x="580" y="260" font-family="'Inter', sans-serif" font-size="12" fill="#a6adc8">2 weeks ago</text>
  <text x="830" y="260" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#fab387" text-anchor="end">4.72 GB</text>

  <!-- Row 2 -->
  <text x="260" y="310" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">web-app / node_modules</text>
  <text x="260" y="327" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6c7086">~/Projects/web-app/node_modules</text>
  <text x="580" y="315" font-family="'Inter', sans-serif" font-size="12" fill="#a6adc8">1 month ago</text>
  <text x="830" y="315" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#fab387" text-anchor="end">842.1 MB</text>

  <!-- Row 3 -->
  <text x="260" y="365" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">ml-service / .venv</text>
  <text x="260" y="382" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6c7086">~/Projects/ml-service/.venv</text>
  <text x="580" y="370" font-family="'Inter', sans-serif" font-size="12" fill="#a6adc8">3 months ago</text>
  <text x="830" y="370" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#fab387" text-anchor="end">620.4 MB</text>

  <!-- Row 4 -->
  <text x="260" y="420" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">portfolio / .next</text>
  <text x="260" y="437" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6c7086">~/Projects/portfolio/.next</text>
  <text x="580" y="425" font-family="'Inter', sans-serif" font-size="12" fill="#a6adc8">5 days ago</text>
  <text x="830" y="425" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#fab387" text-anchor="end">412.0 MB</text>

  <!-- Bottom Action Bar -->
  <rect x="240" y="465" width="670" height="50" rx="8" fill="#181825" stroke="#313244" stroke-width="1"/>
  <text x="260" y="495" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#cdd6f4">Selected: <tspan fill="#a6e3a1">2 items (5.56 GB)</tspan></text>

  <rect x="710" y="475" width="90" height="30" rx="6" fill="#313244"/>
  <text x="755" y="495" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#f9e2af" text-anchor="middle">Dry Run</text>

  <rect x="810" y="475" width="90" height="30" rx="6" fill="#f38ba8"/>
  <text x="855" y="495" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#11111b" text-anchor="middle">Delete</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
    <defs>
        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <linearGradient id="slashGradient" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ef4444" />
            <stop offset="100%" stop-color="#f97316" />
        </linearGradient>
    </defs>

    <!-- Background Grid -->
    <path d="M10 20 L110 20 M10 40 L110 40 M10 60 L110 60 M10 80 L110 80 M10 100 L110 100" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <path d="M20 10 L20 110 M40 10 L40 110 M60 10 L60 110 M80 10 L80 110 M100 10 L100 110" stroke="rgba(255,255,255,0.05)" stroke-width="1" />

    <!-- Stylized Node / Folder Shape -->
    <path d="M25 35 L45 35 L55 45 L95 45 A5 5 0 0 1 100 50 L100 90 A5 5 0 0 1 95 95 L25 95 A5 5 0 0 1 20 90 L20 40 A5 5 0 0 1 25 35 Z" fill="none" stroke="url(#gradient)" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Inner Data Blocks -->
    <rect x="30" y="55" width="20" height="8" rx="2" fill="url(#gradient)" opacity="0.6"/>
    <rect x="30" y="70" width="35" height="8" rx="2" fill="url(#gradient)" opacity="0.6"/>

    <!-- Wipe Slash / Laser -->
    <path d="M15 105 L105 15" stroke="url(#slashGradient)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Sparkles / Particles -->
    <circle cx="85" cy="30" r="2" fill="#ef4444" />
    <circle cx="95" cy="20" r="3" fill="#f97316" />
    <circle cx="20" cy="100" r="2.5" fill="#ef4444" />
</svg>
